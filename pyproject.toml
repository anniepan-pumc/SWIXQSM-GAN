[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swixqsm-gan"
version = "0.2.0"
description = "Synthetic QSM from routine SWI (revision package including C2 recipe)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Xingqi Pan" }]
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.24,<3",
  "nibabel>=5,<6",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["swixqsm_minimal*"]
